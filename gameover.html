<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏结束</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');

    :root {
      --pink: #FF8FAB;
      --pink-dark: #FF6B9D;
      --pink-light: #FFB7C5;
      --pink-lighter: #FFD6E0;
      --pink-bg: #FFF0F5;
      --purple: #B39DDB;
      --purple-light: #D1C4E9;
      --purple-bg: #F3E5F5;
      --cyan: #80DEEA;
      --cyan-bg: #E0F7FA;
      --mint: #A5D6A7;
      --mint-bg: #E8F5E9;
      --cream: #FFF9C4;
      --white: #FFFFFF;
      --text: #5D4037;
      --text-light: #8D6E63;
      --shadow-sm: 0 2px 8px rgba(255,143,171,0.15);
      --shadow-md: 0 4px 16px rgba(255,143,171,0.2);
      --shadow-lg: 0 8px 30px rgba(255,143,171,0.25);
      --radius: 14px;
      --radius-lg: 22px;
      --radius-xl: 28px;
      --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Zen Maru Gothic', 'M PLUS Rounded 1c', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      background: linear-gradient(135deg, #FFF5F8 0%, #F5EEFF 50%, #EDF8FF 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 640px;
      width: 100%;
    }

    /* ========== 标题 ========== */
    .gameover-title {
      font-size: 36px;
      font-weight: 900;
      text-align: center;
      margin-bottom: 40px;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--pink-dark), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 2px 4px rgba(255,107,157,0.3));
    }

    /* ========== 数据概览卡片 ========== */
    .stats-cards {
      display: flex;
      gap: 16px;
      margin-bottom: 40px;
    }

    .stat-card {
      flex: 1;
      border: 3px solid var(--pink-light);
      padding: 20px 16px;
      text-align: center;
      border-radius: var(--radius-lg);
      background: var(--white);
      box-shadow: var(--shadow-md);
      transition: all 0.25s var(--bounce);
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .stat-card .stat-number {
      font-size: 36px;
      font-weight: 900;
      line-height: 1.2;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-card .stat-label {
      font-size: 14px;
      color: var(--text-light);
      margin-top: 6px;
      font-weight: 600;
    }

    /* ========== 列表区域 ========== */
    .section {
      margin-bottom: 32px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 3px solid var(--pink-lighter);
      color: var(--text);
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      display: inline-block;
      padding: 6px 14px;
      border: 2px solid var(--pink-light);
      font-size: 14px;
      background: var(--white);
      color: var(--text);
      cursor: default;
      border-radius: 999px;
      font-weight: 600;
      transition: all 0.2s var(--bounce);
    }

    .tag.correct {
      background: var(--mint);
      color: var(--white);
      border-color: var(--mint);
      cursor: pointer;
    }

    .tag.correct:hover {
      background: #81C784;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(165,214,167,0.4);
    }

    .tag.wrong {
      cursor: pointer;
      border-color: #EF9A9A;
    }

    .tag.wrong:hover {
      background: #FFCDD2;
      border-color: #E57373;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(239,154,154,0.3);
    }

    .empty-hint {
      color: var(--text-light);
      font-size: 14px;
      font-style: italic;
    }

    /* ========== 弹窗 ========== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(93, 64, 55, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: var(--white);
      border: 3px solid var(--pink-light);
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 32px;
      position: relative;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 16px;
      font-size: 24px;
      cursor: pointer;
      background: none;
      border: none;
      color: var(--text-light);
      line-height: 1;
      transition: color 0.2s ease;
    }

    .modal-close:hover {
      color: var(--pink);
    }

    .modal-question {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 20px;
      line-height: 1.5;
      color: var(--text);
    }

    .modal-option {
      padding: 10px 14px;
      margin-bottom: 6px;
      border: 2px solid #F0E0E8;
      font-size: 15px;
      border-radius: var(--radius);
      transition: all 0.2s ease;
    }

    .modal-option.correct-answer {
      border-color: var(--mint);
      background: var(--mint-bg);
      font-weight: 700;
    }

    .modal-option.user-answer {
      border-color: #EF9A9A;
      background: #FFF5F5;
      text-decoration: line-through;
    }

    .modal-option-label {
      display: inline-block;
      width: 24px;
      font-weight: 800;
      color: var(--pink);
    }

    .modal-summary {
      margin-top: 16px;
      font-size: 14px;
      color: var(--text-light);
      padding-top: 12px;
      border-top: 2px solid var(--pink-lighter);
    }

    /* ========== 返回按钮 ========== */
    .btn-back {
      display: block;
      margin: 40px auto 0;
      padding: 14px 48px;
      font-size: 16px;
      border: 3px solid var(--pink);
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: var(--white);
      cursor: pointer;
      transition: all 0.25s var(--bounce);
      border-radius: var(--radius-xl);
      font-family: inherit;
      font-weight: 800;
      letter-spacing: 2px;
      box-shadow: var(--shadow-md);
    }

    .btn-back:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: var(--shadow-lg);
    }

    /* ========== 成就区域 ========== */
    .ach-section-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 3px solid var(--pink-lighter);
      color: var(--text);
    }

    .ach-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border: 2px solid #F0E0E8;
      margin-bottom: 10px;
      text-align: left;
      border-radius: var(--radius);
      background: var(--white);
      transition: all 0.2s ease;
    }

    .ach-card:hover {
      border-color: var(--pink-lighter);
      background: var(--pink-bg);
      transform: translateX(4px);
    }

    .ach-card .ach-icon {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      border: 2px solid var(--pink-lighter);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 14px;
      background: var(--pink-bg);
    }

    .ach-card .ach-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .ach-card .ach-info .ach-name {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 4px;
      color: var(--text);
    }

    .ach-card .ach-info .ach-desc {
      font-size: 13px;
      color: var(--text-light);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 标题 -->
    <h1 class="gameover-title" id="gameoverTitle">游戏结束</h1>

    <!-- 数据卡片 -->
    <div class="stats-cards">
      <div class="stat-card">
        <div class="stat-number" id="correctCount">0</div>
        <div class="stat-label">答对题数</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="totalAnswered">0</div>
        <div class="stat-label">总答题数</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="accuracy">0%</div>
        <div class="stat-label">正确率</div>
      </div>
    </div>

    <!-- 答对题目序号 -->
    <div class="section">
      <div class="section-title">答对题目序号（点击查看详情）</div>
      <div class="tag-list" id="correctTagList"></div>
    </div>

    <!-- 答错题目序号 -->
    <div class="section">
      <div class="section-title">答错题目序号（点击查看详情）</div>
      <div class="tag-list" id="wrongTagList"></div>
    </div>

    <!-- 本局成就 -->
    <div class="section" id="achSection">
      <div class="section-title">本局触发的成就</div>
      <div id="achList"></div>
    </div>

    <!-- 返回按钮 -->
    <button class="btn-back" onclick="window.location.href='index.html'">返回首页</button>
  </div>

  <!-- 弹窗层 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox">
      <button class="modal-close" id="modalClose">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- ========== 题库 ========== -->
  <script src="banks.js"></script>
  <script src="achievements.js"></script>
  <script>
    var selectedBanks = (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('selected_banks') || 'null');
        if (saved && saved.length > 0) return saved;
      } catch (e) {}
      return ['题库1--通用（并非）'];
    })();
    var questions = [];
    if (typeof BANKS !== 'undefined') {
      for (var bi = 0; bi < selectedBanks.length; bi++) {
        var bankName = selectedBanks[bi];
        if (BANKS[bankName]) {
          questions = questions.concat(BANKS[bankName]);
        }
      }
    }
    if (questions.length === 0 && typeof BANKS !== 'undefined' && BANKS['题库1--通用（并非）']) {
      questions = BANKS['题库1--通用（并非）'];
    }
  </script>
  <script>
    (function () {
      // 读取结算数据
      var results = JSON.parse(localStorage.getItem('quiz_results'));

      // 无数据时展示默认状态
      if (!results) {
        document.getElementById('gameoverTitle').textContent = '暂无游戏记录';
        return;
      }

      // 填充数据卡片
      document.getElementById('correctCount').textContent = results.correctCount;
      document.getElementById('totalAnswered').textContent = results.totalAnswered;
      document.getElementById('accuracy').textContent = results.accuracy + '%';

      // 建立题目 ID 索引
      var questionsById = {};
      if (typeof questions !== 'undefined') {
        questions.forEach(function(q) { questionsById[q.id] = q; });
      }

      // 答对题目序号（可点击）
      var correctList = results.correctList || [];
      var correctTagList = document.getElementById('correctTagList');
      if (correctList.length === 0) {
        correctTagList.innerHTML = '<span class="empty-hint">无</span>';
      } else {
        correctList.forEach(function (id) {
          var tag = document.createElement('span');
          tag.className = 'tag correct';
          tag.textContent = '第 ' + id + ' 题';
          tag.addEventListener('click', function () {
            var q = questionsById[id];
            if (q) {
              showCorrectDetail(q);
            }
          });
          correctTagList.appendChild(tag);
        });
      }

      // 答错题目序号（可点击）
      var wrongList = results.wrongList || [];
      var wrongTagList = document.getElementById('wrongTagList');
      if (wrongList.length === 0) {
        wrongTagList.innerHTML = '<span class="empty-hint">无</span>';
      } else {
        wrongList.forEach(function (item, index) {
          var tag = document.createElement('span');
          tag.className = 'tag wrong';
          tag.textContent = '第 ' + item.questionId + ' 题';
          tag.addEventListener('click', function () {
            showQuestionDetail(item);
          });
          wrongTagList.appendChild(tag);
        });
      }

      // ========== 弹窗逻辑 ==========
      var modalOverlay = document.getElementById('modalOverlay');
      var modalContent = document.getElementById('modalContent');
      var modalClose   = document.getElementById('modalClose');

      function showQuestionDetail(item) {
        var html = '<div class="modal-question">' + item.question + '</div>';

        // 渲染所有选项
        ['A', 'B', 'C', 'D'].forEach(function (letter) {
          var optionClass = 'modal-option';
          var label = '';

          if (letter === item.correctAnswer && letter === item.userAnswer) {
            // 既是正确答案又是用户答案（不应该出现在错题中，但做防御）
            optionClass += ' correct-answer';
            label = '<span style="color:#000;">（你的答案，正确）</span>';
          } else if (letter === item.correctAnswer) {
            optionClass += ' correct-answer';
            label = '<span style="color:#000;">（正确答案）</span>';
          } else if (letter === item.userAnswer) {
            optionClass += ' user-answer';
            label = '<span style="color:#999;">（你的答案）</span>';
          }

          html += '<div class="' + optionClass + '">' +
                  '<span class="modal-option-label">' + letter + '.</span>' +
                  item.options[letter] + ' ' + label +
                  '</div>';
        });

        html += '<div class="modal-summary">正确答案: ' + item.correctAnswer +
                ' | 你的选择: ' + item.userAnswer + '</div>';

        modalContent.innerHTML = html;
        modalOverlay.classList.add('active');
      }

      function showCorrectDetail(q) {
        var html = '<div class="modal-question">' + q.question + '</div>';

        ['A', 'B', 'C', 'D'].forEach(function (letter) {
          var optionClass = 'modal-option';
          if (letter === q.answer) {
            optionClass += ' correct-answer';
          }
          html += '<div class="' + optionClass + '">' +
                  '<span class="modal-option-label">' + letter + '.</span>' +
                  q.options[letter] +
                  (letter === q.answer ? ' <span style="color:#000;">（正确答案）</span>' : '') +
                  '</div>';
        });

        html += '<div class="modal-summary">正确答案: ' + q.answer + ' | 本题回答正确</div>';

        modalContent.innerHTML = html;
        modalOverlay.classList.add('active');
      }

      function closeModal() {
        modalOverlay.classList.remove('active');
      }

      modalClose.addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', function (e) {
        if (e.target === modalOverlay) closeModal();
      });

      // ========== 成就展示 ==========
      var sessionAch = results.sessionAchievements || [];
      var achListEl = document.getElementById('achList');
      if (sessionAch.length === 0) {
        achListEl.innerHTML = '<span class="empty-hint">本局未触发成就</span>';
      } else {
        var achHtml = '';
        for (var ai = 0; ai < sessionAch.length; ai++) {
          var a = sessionAch[ai];
          achHtml += '<div class="ach-card">';
          achHtml += '<div class="ach-icon"><img src="' + a.icon + '" alt=""></div>';
          achHtml += '<div class="ach-info">';
          achHtml += '<div class="ach-name">' + a.name + '</div>';
          achHtml += '<div class="ach-desc">' + a.desc + '</div>';
          achHtml += '</div></div>';
        }
        achListEl.innerHTML = achHtml;
      }

      // 清理 localStorage（已展示完毕）
      // localStorage.removeItem('quiz_results');  // 保留以便刷新查看，点击开始新游戏时覆盖
    })();
  </script>

</body>
</html>
