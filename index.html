<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>梗知识答题——但是缝合版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ========== 主容器 ========== */
    .home-container {
      text-align: center;
      max-width: 600px;
      padding: 40px 20px;
    }

    /* ========== 大标题 ========== */
    .main-title {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 60px;
      line-height: 1.3;
    }

    /* ========== 按钮组 ========== */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .btn {
      width: 280px;
      padding: 16px 0;
      font-size: 18px;
      border: 2px solid #000;
      background: #fff;
      color: #000;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 2px;
    }

    .btn:hover {
      background: #000;
      color: #fff;
    }

    .btn-primary {
      background: #000;
      color: #fff;
      font-weight: 700;
      font-size: 20px;
    }

    .btn-primary:hover {
      background: #333;
      border-color: #333;
    }

    /* ========== 选择面板 ========== */
    .select-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .select-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .select-box {
      background: #fff;
      border: 2px solid #000;
      padding: 36px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .select-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .select-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .select-item {
      padding: 14px 0;
      font-size: 16px;
      border: 2px solid #000;
      background: #fff;
      color: #000;
      cursor: pointer;
      transition: all 0.12s ease;
      letter-spacing: 1px;
    }

    .select-item:hover {
      background: #000;
      color: #fff;
    }

    .select-item.selected {
      background: #000;
      color: #fff;
    }

    .select-close {
      padding: 10px 28px;
      font-size: 14px;
      border: 1px solid #999;
      background: #fff;
      color: #666;
      cursor: pointer;
    }

    .select-close:hover {
      border-color: #000;
      color: #000;
    }

    .select-hint {
      font-size: 13px;
      color: #999;
      margin-top: 12px;
    }

    /* ========== 题库多选样式 ========== */
    .bank-select-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #e0e0e0;
      background: #fff;
      color: #000;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .bank-select-item:hover {
      border-color: #000;
    }

    .bank-select-item .bank-name {
      text-align: left;
      letter-spacing: 1px;
    }

    .bank-select-item .bank-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .bank-select-item.selected {
      border-color: #000;
      background: #000;
      color: #fff;
    }

    .bank-select-item.selected .bank-checkbox {
      border-color: #fff;
      background: #fff;
      color: #000;
    }

    /* ========== 成就弹窗（右下角滑动弹出） ========== */
    @keyframes achSlideIn {
      0%   { transform: translateX(120%); }
      100% { transform: translateX(0); }
    }

    @keyframes achSlideOut {
      0%   { transform: translateX(0); }
      100% { transform: translateX(120%); }
    }

    .ach-popup {
      position: fixed;
      right: 20px;
      bottom: 30px;
      width: 280px;
      background: #fff;
      border: 2px solid #000;
      padding: 16px;
      z-index: 2000;
      transform: translateX(120%);
      transition: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .ach-popup.show {
      animation: achSlideIn 0.45s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }

    .ach-popup.hide-slide {
      animation: achSlideOut 0.3s ease-in forwards;
    }

    .ach-popup .ach-popup-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .ach-popup .ach-popup-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ach-popup .ach-popup-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .ach-popup .ach-popup-title {
      font-weight: 900;
      font-size: 16px;
      color: #000;
    }

    .ach-popup .ach-popup-desc {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }

    /* ========== 成就面板样式 ========== */
    .ach-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border: 1px solid #e0e0e0;
      margin-bottom: 8px;
      text-align: left;
    }

    .ach-card .ach-icon {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .ach-card .ach-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .ach-card .ach-info .ach-name {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 2px;
    }

    .ach-card .ach-info .ach-desc {
      font-size: 12px;
      color: #666;
    }

    .ach-card.locked {
      opacity: 0.35;
    }

    .ach-card.locked .ach-icon {
      background: #f0f0f0;
    }

    

  </style>
</head>
<body>

  <div class="home-container">
    <!-- 大标题 -->
    <h1 class="main-title">梗知识答题？？？<br>但缝合版！！！</h1>

    <!-- 主导航按钮 -->
    <div class="btn-group">
      <button class="btn btn-primary" onclick="showStartGameSub()">开始游戏</button>
      <button class="btn" onclick="showAchievements()">成就</button>
      <button class="btn" onclick="goTo('instructions.html')">游戏说明</button>
      <button class="btn" onclick="showOtherSub()">其他</button>
    </div>
  </div>

  <!-- 「开始游戏」子面板 -->
  <div class="select-overlay" id="startGameSub">
    <div class="select-box">
      <div class="select-title">选择模式</div>
      <div class="select-list">
        <button class="select-item" onclick="startQuizFlow()">答题</button>
        <button class="select-item" onclick="startMinigameFlow()">小游戏</button>
      </div>
      <button class="select-close" onclick="closePanel('startGameSub')">关闭</button>
    </div>
  </div>

  <!-- 「其他」子面板 -->
  <div class="select-overlay" id="otherSub">
    <div class="select-box">
      <div class="select-title">其他</div>
      <div class="select-list">
        <button class="select-item" onclick="closePanel('otherSub'); goTo('settings.html')">游戏设置</button>
        <button class="select-item" onclick="closePanel('otherSub'); goTo('contact.html')">联系我们</button>
      </div>
      <button class="select-close" onclick="closePanel('otherSub')">关闭</button>
    </div>
  </div>

  <!-- 成就面板 -->
  <div class="select-overlay" id="achievementsPanel">
    <div class="select-box">
      <div class="select-title">成就</div>
      <div class="select-list" id="achContent">
        <div style="padding:20px;color:#999;font-size:14px;">（成就系统筹备中，敬请期待）</div>
      </div>
      <button class="select-close" onclick="closePanel('achievementsPanel')">关闭</button>
    </div>
  </div>

  <!-- 选择题库面板 -->
  <div class="select-overlay" id="bankOverlay">
    <div class="select-box">
      <div class="select-title">选择题库</div>
      <div class="select-list" id="bankList"></div>
      <button class="select-close" onclick="confirmBankAndStart()">开始答题</button>
    </div>
  </div>

  <!-- 小游戏选择面板 -->
  <div class="select-overlay" id="minigameOverlay">
    <div class="select-box">
      <div class="select-title">选择小游戏</div>
      <div class="select-list" id="minigameList"></div>
      <button class="select-close" onclick="closePanel('minigameOverlay')">关闭</button>
    </div>
  </div>

  <!-- 成就弹出提示（右下角） -->
  <div class="ach-popup" id="achPopup">
    <div class="ach-popup-header">
      <div class="ach-popup-icon" id="achPopupIcon"></div>
      <div class="ach-popup-title" id="achPopupName"></div>
    </div>
    <div class="ach-popup-desc" id="achPopupDesc"></div>
  </div>

  <script src="banks.js"></script>
  <script src="achievements.js"></script>
  <script>
    // ========== 通用面板 ==========
    function showPanel(id) {
      document.getElementById(id).classList.add('active');
    }
    function closePanel(id) {
      document.getElementById(id).classList.remove('active');
    }

    // ========== 「开始游戏」子菜单 ==========
    function showStartGameSub() {
      showPanel('startGameSub');
    }

    function startQuizFlow() {
      closePanel('startGameSub');
      showBankSelect();
    }

    function startMinigameFlow() {
      closePanel('startGameSub');
      showMinigameSelect();
    }

    // ========== 「其他」子菜单 ==========
    function showOtherSub() {
      showPanel('otherSub');
    }

    // ========== 成就弹窗（右下角滑动） ==========
    var achPopupTimer = null;

    function showAchievementPopup(achId) {
      var def = ACHIEVEMENTS.DEFS.find(function (d) { return d.id === achId; });
      if (!def) return;
      if (achPopupTimer) clearTimeout(achPopupTimer);

      var popup = document.getElementById('achPopup');
      document.getElementById('achPopupIcon').innerHTML = '<img src="' + def.icon + '" alt="">';
      document.getElementById('achPopupName').textContent = def.name;
      document.getElementById('achPopupDesc').textContent = def.desc;
      popup.classList.remove('hide-slide');

      // 显示
      popup.classList.add('show');

      // 3秒后自动隐藏
      achPopupTimer = setTimeout(function () {
        popup.classList.remove('show');
        popup.classList.add('hide-slide');
        setTimeout(function () {
          popup.classList.remove('hide-slide');
        }, 300);
      }, 3000);
    }

    // ========== 成就面板 ==========
    function showAchievements() {
      var allDefs = ACHIEVEMENTS.DEFS;
      var html = '';
      for (var i = 0; i < allDefs.length; i++) {
        var d = allDefs[i];
        var isUnlocked = ACHIEVEMENTS.isUnlocked(d.id);
        html += '<div class="ach-card' + (isUnlocked ? '' : ' locked') + '">';
        html += '<div class="ach-icon"><img src="' + (isUnlocked ? d.icon : ACHIEVEMENTS.getLockIcon()) + '" alt=""></div>';
        html += '<div class="ach-info"><div class="ach-name">' + (isUnlocked ? d.name : '???') + '</div>';
        html += '<div class="ach-desc">' + (isUnlocked ? d.desc : '尚未解锁') + '</div></div>';
        html += '</div>';
      }
      document.getElementById('achContent').innerHTML = html;
      showPanel('achievementsPanel');
    }

    // ========== 题库多选 ==========
    var selectedBanks = (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('selected_banks') || 'null');
        if (saved && saved.length > 0) return saved;
      } catch (e) {}
      return ['题库1--通用（并非）'];
    })();

    function showBankSelect() {
      var bankNames = [];
      if (typeof BANKS !== 'undefined') {
        bankNames = Object.keys(BANKS);
      }
      if (bankNames.length === 0) {
        bankNames = ['题库1--通用（并非）'];
      }

      var listHtml = '';
      for (var i = 0; i < bankNames.length; i++) {
        var name = bankNames[i];
        var isSelected = (selectedBanks.indexOf(name) !== -1);
        listHtml += '<div class="bank-select-item' + (isSelected ? ' selected' : '') + '" onclick="toggleBank(\'' + name.replace(/'/g, "\\'") + '\')">';
        listHtml += '<span class="bank-name">' + name + '</span>';
        listHtml += '<span class="bank-checkbox">' + (isSelected ? '✓' : '') + '</span>';
        listHtml += '</div>';
      }
      document.getElementById('bankList').innerHTML = listHtml;
      showPanel('bankOverlay');
    }

    function toggleBank(name) {
      var idx = selectedBanks.indexOf(name);
      if (idx === -1) {
        selectedBanks.push(name);
      } else {
        selectedBanks.splice(idx, 1);
      }
      try { localStorage.setItem('selected_banks', JSON.stringify(selectedBanks)); } catch (e) {}
      showBankSelect(); // 刷新面板
    }

    function confirmBankAndStart() {
      if (selectedBanks.length === 0) {
        alert('请至少选择一个题库！');
        return;
      }
      closePanel('bankOverlay');
      doStartGame();
    }

    // 为所有子面板、题库面板、小游戏面板、成就面板绑定遮罩点击关闭
    ['startGameSub', 'otherSub', 'achievementsPanel', 'bankOverlay', 'minigameOverlay'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) {
        el.addEventListener('click', function (e) {
          if (e.target === this) closePanel(id);
        });
      }
    });

    // ========== 小游戏选择 ==========
    var MINIGAMES = [
      { id: 'minigame1', name: '霓虹跑酷', path: 'minigame1/index.html' },
      { id: 'minigame2', name: '霓虹飞驰', path: 'minigame2/index.html' },
      { id: 'minigame3', name: '精灵大作战', path: 'minigame3/index.html' }
    ];

    function showMinigameSelect() {
      var listHtml = '';
      for (var i = 0; i < MINIGAMES.length; i++) {
        var mg = MINIGAMES[i];
        listHtml += '<button class="select-item" onclick="launchMinigame(\'' + mg.path + '\')">' + mg.name + '</button>';
      }
      document.getElementById('minigameList').innerHTML = listHtml;
      showPanel('minigameOverlay');
    }

    function launchMinigame(path) {
      // 成就检测：小游戏爱好者
      var justUnlocked = ACHIEVEMENTS.unlock('first_minigame');
      localStorage.removeItem('quiz_returning');
      if (justUnlocked) {
        showAchievementPopup('first_minigame');
        setTimeout(function () { window.location.href = path; }, 1200);
      } else {
        window.location.href = path;
      }
    }

    // ========== 开始游戏 ==========
    function doStartGame() {
      try {
        localStorage.removeItem('quiz_state');
        localStorage.removeItem('quiz_returning');
        localStorage.removeItem('quiz_results');
        localStorage.removeItem('quiz_seed');
        localStorage.removeItem('quiz_rng_count');
        localStorage.removeItem('quiz_bonus_time');
        localStorage.removeItem('quiz_minigame_history');
        localStorage.removeItem('quiz_minigame_index');
        localStorage.removeItem('quiz_session_achievements');

        // 重置本次会话成就记录
        ACHIEVEMENTS.resetSession();

        var gameState = {
          currentQuestionIndex: 0,
          correctQuestions: [],
          wrongQuestions: [],
          timeLeft: 60,
          initialTime: 60,
          answeredCount: 0
        };
        localStorage.setItem('quiz_state', JSON.stringify(gameState));
        window.location.href = 'quiz.html';
      } catch (e) {
        alert('启动游戏失败：' + e.message + '\n请尝试用 Chrome 或 Edge 浏览器打开。');
      }
    }

    function goTo(url) {
      // 追踪说明书爱好者成就
      if (url === 'instructions.html' && !ACHIEVEMENTS.isUnlocked('instructions')) {
        ACHIEVEMENTS.unlock('instructions');
        showAchievementPopup('instructions');
        setTimeout(function () { window.location.href = url; }, 1200);
        return;
      }
      window.location.href = url;
    }
  </script>

</body>
</html>
