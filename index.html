<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>梗知识答题——但是缝合版</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');

    :root {
      --pink: #FF8FAB;
      --pink-dark: #FF6B9D;
      --pink-light: #FFB7C5;
      --pink-lighter: #FFD6E0;
      --pink-bg: #FFF0F5;
      --purple: #B39DDB;
      --purple-light: #D1C4E9;
      --purple-bg: #F3E5F5;
      --cyan: #80DEEA;
      --cyan-bg: #E0F7FA;
      --mint: #A5D6A7;
      --mint-bg: #E8F5E9;
      --cream: #FFF9C4;
      --white: #FFFFFF;
      --text: #5D4037;
      --text-light: #8D6E63;
      --shadow-sm: 0 2px 8px rgba(255,143,171,0.15);
      --shadow-md: 0 4px 16px rgba(255,143,171,0.2);
      --shadow-lg: 0 8px 30px rgba(255,143,171,0.25);
      --radius: 14px;
      --radius-lg: 22px;
      --radius-xl: 28px;
      --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Zen Maru Gothic', 'M PLUS Rounded 1c', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      background: linear-gradient(135deg, #FFE0EC 0%, #E8D5F5 50%, #D5F0F7 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        radial-gradient(circle at 15% 85%, rgba(255,183,197,0.35) 0%, transparent 50%),
        radial-gradient(circle at 85% 15%, rgba(179,157,219,0.25) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(128,222,234,0.15) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ========== 漂浮装饰 ========== */
    .deco {
      position: fixed;
      font-size: 26px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
      animation: decoFloat 5s ease-in-out infinite;
    }
    .deco:nth-child(2n) { animation-delay: -1.5s; animation-duration: 6s; }
    .deco:nth-child(3n) { animation-delay: -3s; animation-duration: 7s; }

    @keyframes decoFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-14px) rotate(8deg); }
      50% { transform: translateY(-6px) rotate(-4deg); }
      75% { transform: translateY(-18px) rotate(6deg); }
    }

    /* ========== 主容器 ========== */
    .home-container {
      text-align: center;
      max-width: 600px;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }

    /* ========== 大标题 ========== */
    .main-title {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 60px;
      line-height: 1.4;
      background: linear-gradient(135deg, #FF6B9D, #B39DDB, #80DEEA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 3px 6px rgba(255,107,157,0.3));
    }

    /* ========== 按钮组 ========== */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .btn {
      width: 280px;
      padding: 16px 0;
      font-size: 18px;
      border: 3px solid var(--pink);
      background: var(--white);
      color: var(--pink);
      cursor: pointer;
      transition: all 0.3s var(--bounce);
      letter-spacing: 2px;
      border-radius: var(--radius-xl);
      font-weight: 700;
      font-family: inherit;
      box-shadow: var(--shadow-md);
    }

    .btn:hover {
      background: var(--pink);
      color: var(--white);
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 25px rgba(255,143,171,0.4);
    }

    .btn:active {
      transform: translateY(0) scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: var(--white);
      font-weight: 800;
      font-size: 20px;
      border-color: transparent;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--pink-dark), var(--pink));
      border-color: transparent;
      transform: translateY(-3px) scale(1.03);
    }

    /* ========== 选择面板 ========== */
    .select-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(93, 64, 55, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      backdrop-filter: blur(6px);
    }

    .select-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .select-box {
      background: var(--white);
      border: 3px solid var(--pink-light);
      padding: 36px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
    }

    .select-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 24px;
      color: var(--text);
    }

    .select-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .select-item {
      padding: 14px 0;
      font-size: 16px;
      border: 2px solid var(--pink-lighter);
      background: var(--white);
      color: var(--text);
      cursor: pointer;
      transition: all 0.25s var(--bounce);
      letter-spacing: 1px;
      border-radius: var(--radius);
      font-weight: 600;
      font-family: inherit;
    }

    .select-item:hover {
      background: var(--pink-bg);
      border-color: var(--pink);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .select-item.selected {
      background: var(--pink);
      color: var(--white);
      border-color: var(--pink);
    }

    .select-close {
      padding: 10px 28px;
      font-size: 14px;
      border: 2px solid var(--purple-light);
      background: var(--white);
      color: var(--text-light);
      cursor: pointer;
      border-radius: var(--radius);
      font-family: inherit;
      font-weight: 600;
      transition: all 0.25s ease;
    }

    .select-close:hover {
      border-color: var(--purple);
      color: var(--purple);
      background: var(--purple-bg);
    }

    .select-hint {
      font-size: 13px;
      color: var(--text-light);
      margin-top: 12px;
    }

    /* ========== 题库多选样式 ========== */
    .bank-select-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #F0E0E8;
      background: var(--white);
      color: var(--text);
      cursor: pointer;
      transition: all 0.25s var(--bounce);
      border-radius: var(--radius);
      font-family: inherit;
    }

    .bank-select-item:hover {
      border-color: var(--pink);
      background: var(--pink-bg);
      transform: translateY(-1px);
    }

    .bank-select-item .bank-name {
      text-align: left;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .bank-select-item .bank-checkbox {
      width: 26px;
      height: 26px;
      border: 2px solid var(--pink-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      flex-shrink: 0;
      border-radius: 8px;
      color: var(--pink);
      transition: all 0.2s ease;
    }

    .bank-select-item.selected {
      border-color: var(--pink);
      background: var(--pink);
      color: var(--white);
    }

    .bank-select-item.selected .bank-checkbox {
      border-color: var(--white);
      background: var(--white);
      color: var(--pink);
    }

    /* ========== 成就弹窗（右下角滑动弹出） ========== */
    @keyframes achSlideIn {
      0%   { transform: translateX(120%) scale(0.8); opacity: 0; }
      100% { transform: translateX(0) scale(1); opacity: 1; }
    }

    @keyframes achSlideOut {
      0%   { transform: translateX(0) scale(1); opacity: 1; }
      100% { transform: translateX(120%) scale(0.8); opacity: 0; }
    }

    .ach-popup {
      position: fixed;
      right: 20px;
      bottom: 30px;
      width: 280px;
      background: var(--white);
      border: 3px solid var(--pink-light);
      padding: 16px;
      z-index: 2000;
      transform: translateX(120%);
      transition: none;
      box-shadow: var(--shadow-lg);
      border-radius: var(--radius-lg);
    }

    .ach-popup.show {
      animation: achSlideIn 0.5s var(--bounce) forwards;
    }

    .ach-popup.hide-slide {
      animation: achSlideOut 0.3s ease-in forwards;
    }

    .ach-popup .ach-popup-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .ach-popup .ach-popup-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: 2px solid var(--pink-lighter);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      overflow: hidden;
      background: var(--pink-bg);
    }

    .ach-popup .ach-popup-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .ach-popup .ach-popup-title {
      font-weight: 800;
      font-size: 16px;
      color: var(--text);
    }

    .ach-popup .ach-popup-desc {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 4px;
    }

    /* ========== 成就面板样式 ========== */
    .ach-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border: 2px solid #F0E0E8;
      margin-bottom: 10px;
      text-align: left;
      border-radius: var(--radius);
      transition: all 0.2s ease;
      background: var(--white);
    }

    .ach-card:hover {
      border-color: var(--pink-lighter);
      background: var(--pink-bg);
      transform: translateX(4px);
    }

    .ach-card .ach-icon {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border: 2px solid var(--pink-lighter);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 14px;
      background: var(--pink-bg);
    }

    .ach-card .ach-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .ach-card .ach-info .ach-name {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 2px;
      color: var(--text);
    }

    .ach-card .ach-info .ach-desc {
      font-size: 12px;
      color: var(--text-light);
    }

    .ach-card.locked {
      opacity: 0.4;
    }

    .ach-card.locked .ach-icon {
      background: #f5f5f5;
      border-color: #e0e0e0;
    }
  </style>
</head>
<body>

  <!-- 漂浮装饰 -->
  <div class="deco" style="top:8%;left:6%;font-size:32px;">♡</div>
  <div class="deco" style="top:12%;right:10%;font-size:22px;">⭐</div>
  <div class="deco" style="top:65%;left:10%;font-size:24px;">✨</div>
  <div class="deco" style="top:72%;right:6%;font-size:28px;">♡</div>
  <div class="deco" style="top:35%;left:3%;font-size:20px;">🌸</div>
  <div class="deco" style="top:45%;right:4%;font-size:24px;">💫</div>
  <div class="deco" style="top:88%;left:45%;font-size:22px;">🎀</div>
  <div class="deco" style="top:5%;left:50%;font-size:20px;">✨</div>

  <div class="home-container">
    <!-- 大标题 -->
    <h1 class="main-title">梗知识答题？？？<br>但缝合版！！！</h1>

    <!-- 主导航按钮 -->
    <div class="btn-group">
      <button class="btn btn-primary" onclick="showStartGameSub()">开始游戏</button>
      <button class="btn" onclick="showAchievements()">成就</button>
      <button class="btn" onclick="goTo('instructions.html')">游戏说明</button>
      <button class="btn" onclick="showOtherSub()">其他</button>
    </div>
  </div>

  <!-- 「开始游戏」子面板 -->
  <div class="select-overlay" id="startGameSub">
    <div class="select-box">
      <div class="select-title">选择模式</div>
      <div class="select-list">
        <button class="select-item" onclick="startQuizFlow()">答题</button>
        <button class="select-item" onclick="startMinigameFlow()">小游戏</button>
      </div>
      <button class="select-close" onclick="closePanel('startGameSub')">关闭</button>
    </div>
  </div>

  <!-- 「其他」子面板 -->
  <div class="select-overlay" id="otherSub">
    <div class="select-box">
      <div class="select-title">其他</div>
      <div class="select-list">
        <button class="select-item" onclick="closePanel('otherSub'); goTo('settings.html')">游戏设置</button>
        <button class="select-item" onclick="closePanel('otherSub'); goTo('contact.html')">联系我们</button>
      </div>
      <button class="select-close" onclick="closePanel('otherSub')">关闭</button>
    </div>
  </div>

  <!-- 成就面板 -->
  <div class="select-overlay" id="achievementsPanel">
    <div class="select-box">
      <div class="select-title">成就</div>
      <div class="select-list" id="achContent">
        <div style="padding:20px;color:#999;font-size:14px;">（成就系统筹备中，敬请期待）</div>
      </div>
      <button class="select-close" onclick="closePanel('achievementsPanel')">关闭</button>
    </div>
  </div>

  <!-- 选择题库面板 -->
  <div class="select-overlay" id="bankOverlay">
    <div class="select-box">
      <div class="select-title">选择题库</div>
      <div class="select-list" id="bankList"></div>
      <button class="select-close" onclick="confirmBankAndStart()">开始答题</button>
    </div>
  </div>

  <!-- 小游戏选择面板 -->
  <div class="select-overlay" id="minigameOverlay">
    <div class="select-box">
      <div class="select-title">选择小游戏</div>
      <div class="select-list" id="minigameList"></div>
      <button class="select-close" onclick="closePanel('minigameOverlay')">关闭</button>
    </div>
  </div>

  <!-- 成就弹出提示（右下角） -->
  <div class="ach-popup" id="achPopup">
    <div class="ach-popup-header">
      <div class="ach-popup-icon" id="achPopupIcon"></div>
      <div class="ach-popup-title" id="achPopupName"></div>
    </div>
    <div class="ach-popup-desc" id="achPopupDesc"></div>
  </div>

  <script src="banks.js"></script>
  <script src="achievements.js"></script>
  <script>
    // ========== 通用面板 ==========
    function showPanel(id) {
      document.getElementById(id).classList.add('active');
    }
    function closePanel(id) {
      document.getElementById(id).classList.remove('active');
    }

    // ========== 「开始游戏」子菜单 ==========
    function showStartGameSub() {
      showPanel('startGameSub');
    }

    function startQuizFlow() {
      closePanel('startGameSub');
      showBankSelect();
    }

    function startMinigameFlow() {
      closePanel('startGameSub');
      showMinigameSelect();
    }

    // ========== 「其他」子菜单 ==========
    function showOtherSub() {
      showPanel('otherSub');
    }

    // ========== 成就弹窗（右下角滑动） ==========
    var achPopupTimer = null;

    function showAchievementPopup(achId) {
      var def = ACHIEVEMENTS.DEFS.find(function (d) { return d.id === achId; });
      if (!def) return;
      if (achPopupTimer) clearTimeout(achPopupTimer);

      var popup = document.getElementById('achPopup');
      document.getElementById('achPopupIcon').innerHTML = '<img src="' + def.icon + '" alt="">';
      document.getElementById('achPopupName').textContent = def.name;
      document.getElementById('achPopupDesc').textContent = def.desc;
      popup.classList.remove('hide-slide');

      // 显示
      popup.classList.add('show');

      // 3秒后自动隐藏
      achPopupTimer = setTimeout(function () {
        popup.classList.remove('show');
        popup.classList.add('hide-slide');
        setTimeout(function () {
          popup.classList.remove('hide-slide');
        }, 300);
      }, 3000);
    }

    // ========== 成就面板 ==========
    function showAchievements() {
      var allDefs = ACHIEVEMENTS.DEFS;
      var html = '';
      for (var i = 0; i < allDefs.length; i++) {
        var d = allDefs[i];
        var isUnlocked = ACHIEVEMENTS.isUnlocked(d.id);
        html += '<div class="ach-card' + (isUnlocked ? '' : ' locked') + '">';
        html += '<div class="ach-icon"><img src="' + (isUnlocked ? d.icon : ACHIEVEMENTS.getLockIcon()) + '" alt=""></div>';
        html += '<div class="ach-info"><div class="ach-name">' + (isUnlocked ? d.name : '???') + '</div>';
        html += '<div class="ach-desc">' + (isUnlocked ? d.desc : '尚未解锁') + '</div></div>';
        html += '</div>';
      }
      document.getElementById('achContent').innerHTML = html;
      showPanel('achievementsPanel');
    }

    // ========== 题库多选 ==========
    var selectedBanks = (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('selected_banks') || 'null');
        if (saved && saved.length > 0) return saved;
      } catch (e) {}
      return ['题库1--通用（并非）'];
    })();

    function showBankSelect() {
      var bankNames = [];
      if (typeof BANKS !== 'undefined') {
        bankNames = Object.keys(BANKS);
      }
      if (bankNames.length === 0) {
        bankNames = ['题库1--通用（并非）'];
      }

      var listHtml = '';
      for (var i = 0; i < bankNames.length; i++) {
        var name = bankNames[i];
        var isSelected = (selectedBanks.indexOf(name) !== -1);
        listHtml += '<div class="bank-select-item' + (isSelected ? ' selected' : '') + '" onclick="toggleBank(\'' + name.replace(/'/g, "\\'") + '\')">';
        listHtml += '<span class="bank-name">' + name + '</span>';
        listHtml += '<span class="bank-checkbox">' + (isSelected ? '✓' : '') + '</span>';
        listHtml += '</div>';
      }
      document.getElementById('bankList').innerHTML = listHtml;
      showPanel('bankOverlay');
    }

    function toggleBank(name) {
      var idx = selectedBanks.indexOf(name);
      if (idx === -1) {
        selectedBanks.push(name);
      } else {
        selectedBanks.splice(idx, 1);
      }
      try { localStorage.setItem('selected_banks', JSON.stringify(selectedBanks)); } catch (e) {}
      showBankSelect(); // 刷新面板
    }

    function confirmBankAndStart() {
      if (selectedBanks.length === 0) {
        alert('请至少选择一个题库！');
        return;
      }
      closePanel('bankOverlay');
      doStartGame();
    }

    // 为所有子面板、题库面板、小游戏面板、成就面板绑定遮罩点击关闭
    ['startGameSub', 'otherSub', 'achievementsPanel', 'bankOverlay', 'minigameOverlay'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) {
        el.addEventListener('click', function (e) {
          if (e.target === this) closePanel(id);
        });
      }
    });

    // ========== 小游戏选择 ==========
    var MINIGAMES = [
      { id: 'minigame1', name: '霓虹跑酷', path: 'minigame1/index.html' },
      { id: 'minigame2', name: '霓虹飞驰', path: 'minigame2/index.html' },
      { id: 'minigame3', name: '精灵大作战', path: 'minigame3/index.html' }
    ];

    function showMinigameSelect() {
      var listHtml = '';
      for (var i = 0; i < MINIGAMES.length; i++) {
        var mg = MINIGAMES[i];
        listHtml += '<button class="select-item" onclick="launchMinigame(\'' + mg.path + '\')">' + mg.name + '</button>';
      }
      document.getElementById('minigameList').innerHTML = listHtml;
      showPanel('minigameOverlay');
    }

    function launchMinigame(path) {
      // 成就检测：小游戏爱好者
      var justUnlocked = ACHIEVEMENTS.unlock('first_minigame');
      localStorage.removeItem('quiz_returning');
      if (justUnlocked) {
        showAchievementPopup('first_minigame');
        setTimeout(function () { window.location.href = path; }, 1200);
      } else {
        window.location.href = path;
      }
    }

    // ========== 开始游戏 ==========
    function doStartGame() {
      try {
        localStorage.removeItem('quiz_state');
        localStorage.removeItem('quiz_returning');
        localStorage.removeItem('quiz_results');
        localStorage.removeItem('quiz_seed');
        localStorage.removeItem('quiz_rng_count');
        localStorage.removeItem('quiz_bonus_time');
        localStorage.removeItem('quiz_minigame_history');
        localStorage.removeItem('quiz_minigame_index');
        localStorage.removeItem('quiz_session_achievements');

        // 重置本次会话成就记录
        ACHIEVEMENTS.resetSession();

        var gameState = {
          currentQuestionIndex: 0,
          correctQuestions: [],
          wrongQuestions: [],
          timeLeft: 60,
          initialTime: 60,
          answeredCount: 0
        };
        localStorage.setItem('quiz_state', JSON.stringify(gameState));
        window.location.href = 'quiz.html';
      } catch (e) {
        alert('启动游戏失败：' + e.message + '\n请尝试用 Chrome 或 Edge 浏览器打开。');
      }
    }

    function goTo(url) {
      // 追踪说明书爱好者成就
      if (url === 'instructions.html' && !ACHIEVEMENTS.isUnlocked('instructions')) {
        ACHIEVEMENTS.unlock('instructions');
        showAchievementPopup('instructions');
        setTimeout(function () { window.location.href = url; }, 1200);
        return;
      }
      window.location.href = url;
    }
  </script>
