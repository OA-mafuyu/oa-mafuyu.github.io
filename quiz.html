<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>答题中</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');

    :root {
      --pink: #FF8FAB;
      --pink-dark: #FF6B9D;
      --pink-light: #FFB7C5;
      --pink-lighter: #FFD6E0;
      --pink-bg: #FFF0F5;
      --purple: #B39DDB;
      --purple-light: #D1C4E9;
      --purple-bg: #F3E5F5;
      --cyan: #80DEEA;
      --cyan-bg: #E0F7FA;
      --mint: #A5D6A7;
      --mint-bg: #E8F5E9;
      --cream: #FFF9C4;
      --white: #FFFFFF;
      --text: #5D4037;
      --text-light: #8D6E63;
      --shadow-sm: 0 2px 8px rgba(255,143,171,0.15);
      --shadow-md: 0 4px 16px rgba(255,143,171,0.2);
      --shadow-lg: 0 8px 30px rgba(255,143,171,0.25);
      --radius: 14px;
      --radius-lg: 22px;
      --radius-xl: 28px;
      --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Zen Maru Gothic', 'M PLUS Rounded 1c', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      background: linear-gradient(135deg, #FFF5F8 0%, #F5EEFF 50%, #EDF8FF 100%);
      color: var(--text);
      min-height: 100vh;
    }

    /* ========== 顶部信息栏 ========== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 3px solid var(--pink-lighter);
      font-size: 16px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
    }

    .timer {
      font-weight: 800;
      font-size: 20px;
      color: var(--text);
    }

    .timer.warning {
      color: #FF5252;
      animation: blink 0.5s ease-in-out infinite alternate;
    }

    @keyframes blink {
      from { opacity: 1; }
      to   { opacity: 0.3; }
    }

    /* ========== 答题区域 ========== */
    .quiz-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 56px);
      padding: 40px 20px;
      max-width: 720px;
      margin: 0 auto;
    }

    .question-text {
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 48px;
      line-height: 1.6;
      min-height: 60px;
      color: var(--text);
    }

    /* ========== 选项按钮 ========== */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 560px;
    }

    .option-btn {
      padding: 20px 16px;
      font-size: 18px;
      border: 3px solid var(--pink-light);
      background: var(--white);
      color: var(--text);
      cursor: pointer;
      transition: all 0.25s var(--bounce);
      text-align: left;
      position: relative;
      border-radius: var(--radius);
      font-family: inherit;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .option-btn:hover:not(.disabled) {
      background: var(--pink-bg);
      border-color: var(--pink);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .option-btn .option-label {
      display: inline-block;
      width: 30px;
      height: 30px;
      line-height: 30px;
      text-align: center;
      border: 2px solid var(--pink);
      margin-right: 10px;
      font-weight: 800;
      font-size: 14px;
      vertical-align: middle;
      border-radius: 10px;
      color: var(--pink);
      background: var(--pink-bg);
    }

    .option-btn.disabled {
      pointer-events: none;
      opacity: 0.5;
    }

    .option-btn.correct-flash {
      background: var(--mint);
      color: var(--white);
      border-color: var(--mint);
      box-shadow: 0 4px 16px rgba(165,214,167,0.4);
    }

    .option-btn.wrong-flash {
      background: #FFCDD2;
      border-color: #EF9A9A;
    }

    /* ========== 答错遮罩层 ========== */
    .wrong-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 240, 245, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 5vh;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease;
      overflow: hidden;
    }

    .wrong-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .wrong-text {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--pink-dark);
      text-shadow: 0 2px 8px rgba(255,107,157,0.3);
    }

    .wrong-image {
      width: 80px;
      height: auto;
      margin-top:300px;
      position: relative;
      z-index: 1;
      animation: zoomIn 2s ease-out forwards;
    }

    @keyframes zoomIn {
      0%   { transform: scale(0); opacity: 0; }
      5%   { opacity: 1; }
      100% { transform: scale(30); opacity: 1; }
    }

    /* 惊吓模式动画：匀速放大（linear），持续时间由 animation-duration 控制 */
    @keyframes zoomInScare {
      0%   { transform: scale(0); opacity: 0; }
      3%   { opacity: 1; }
      100% { transform: scale(100); opacity: 1; }
    }

    .wrong-image.scare-anim {
      animation: zoomInScare 1s linear forwards;
    }

    /* ========== 进度条 ========== */
    .timer-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .progress-bar {
      width: 120px;
      height: 6px;
      background: #F0E0E8;
      position: relative;
      overflow: hidden;
      border-radius: 999px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--pink), var(--purple));
      position: absolute;
      right: 0;
      top: 0;
      transition: width 1s linear;
      border-radius: 999px;
    }

    /* ========== 成就弹出提示 ========== */
    .ach-popup {
      position: fixed;
      right: -320px;
      bottom: 100px;
      width: 300px;
      background: var(--white);
      border: 3px solid var(--pink-light);
      z-index: 1200;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      transition: right 0.4s var(--bounce);
      box-shadow: var(--shadow-lg);
      border-radius: var(--radius-lg);
    }

    .ach-popup.show {
      right: 20px;
    }

    .ach-popup .ach-popup-icon {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border: 2px solid var(--pink-lighter);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 14px;
      background: var(--pink-bg);
    }

    .ach-popup .ach-popup-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .ach-popup .ach-popup-info .ach-popup-title {
      font-size: 13px;
      color: var(--text-light);
      margin-bottom: 2px;
    }

    .ach-popup .ach-popup-info .ach-popup-name {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 2px;
      color: var(--text);
    }

    .ach-popup .ach-popup-info .ach-popup-desc {
      font-size: 12px;
      color: var(--text-light);
    }

    .ach-popup .ach-popup-hint {
      font-size: 10px;
      color: var(--text-light);
      margin-top: 4px;
    }

    .ach-popup.frozen {
      border-color: #FF5252;
    }

    /* ========== 答对提示 ========== */
    .correct-toast {
      position: fixed;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--mint);
      color: var(--white);
      padding: 12px 32px;
      font-size: 18px;
      font-weight: 800;
      z-index: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      letter-spacing: 2px;
      border-radius: var(--radius-xl);
      box-shadow: 0 4px 16px rgba(165,214,167,0.4);
    }

    .correct-toast.show {
      opacity: 1;
    }

    /* ========== ESC 退出弹窗 ========== */
    .exit-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(93, 64, 55, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      backdrop-filter: blur(4px);
    }

    .exit-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .exit-box {
      background: var(--white);
      border: 3px solid var(--pink-light);
      padding: 40px 48px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
    }

    .exit-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 32px;
      color: var(--text);
    }

    .exit-btns {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .exit-btn {
      padding: 12px 32px;
      font-size: 16px;
      border: 3px solid var(--pink);
      cursor: pointer;
      transition: all 0.25s var(--bounce);
      background: var(--white);
      color: var(--pink);
      letter-spacing: 1px;
      border-radius: var(--radius);
      font-family: inherit;
      font-weight: 700;
    }

    .exit-btn:hover {
      background: var(--pink);
      color: var(--white);
      transform: translateY(-2px);
    }

    .exit-btn.danger {
      background: var(--pink);
      color: var(--white);
    }

    .exit-btn.danger:hover {
      background: var(--pink-dark);
    }

    /* ========== 小游戏过渡提示 ========== */
    .minigame-toast {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 240, 245, 0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 900;
      opacity: 0;
      pointer-events: none;
    }

    .minigame-toast.active {
      opacity: 1;
      pointer-events: auto;
    }

    .minigame-toast-text {
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      line-height: 1.6;
      color: var(--text);
    }
  </style>
</head>
<body>

  <!-- 顶部信息栏 -->
  <div class="top-bar">
    <span class="seed-display" id="seedDisplay" style="font-size:16px; color:#999; font-family:monospace;"></span>
    <div class="timer-wrapper">
      <span class="timer" id="timer">剩余时间 01:00</span>
      <div class="progress-bar"><div class="progress-bar-fill" id="progressFill" style="width:100%;"></div></div>
    </div>
  </div>

  <!-- 答题主体 -->
  <div class="quiz-wrapper" id="quizWrapper">
    <div class="question-text" id="questionText"></div>
    <div class="options-grid" id="optionsGrid"></div>
  </div>

  <!-- 答错遮罩 -->
  <div class="wrong-overlay" id="wrongOverlay">
    <div class="wrong-text">答错了</div>
    <img class="wrong-image" src="images/kawaii.png" alt="wrong">
  </div>

  <!-- 答对提示 -->
  <div class="correct-toast" id="correctToast">回答正确！</div>

  <!-- 小游戏过渡提示 -->
  <div class="minigame-toast" id="minigameToast">
    <div class="minigame-toast-text">
      即将进入小游戏环节<br>
      <span style="font-size:18px; font-weight:400; color:#666;">加载中...</span>
    </div>
  </div>

  <!-- ESC 退出弹窗 -->
  <div class="exit-overlay" id="exitOverlay">
    <div class="exit-box">
      <div class="exit-title">确定要退出吗？</div>
      <div class="exit-btns">
        <button class="exit-btn danger" id="btnExitConfirm">狠心退出</button>
        <button class="exit-btn" id="btnExitCancel">继续</button>
      </div>
    </div>
  </div>

  <!-- 成就弹出提示 -->
  <div class="ach-popup" id="achPopup">
    <div class="ach-popup-icon" id="achPopupIcon"></div>
    <div class="ach-popup-info">
      <div class="ach-popup-title">成就达成！</div>
      <div class="ach-popup-name" id="achPopupName"></div>
      <div class="ach-popup-desc" id="achPopupDesc"></div>
      <div class="ach-popup-hint">按 ESC 保持常驻</div>
    </div>
  </div>

  <!-- ========== 题库 ========== -->
  <script src="banks.js"></script>
  <script src="achievements.js"></script>
  <script>
    // 根据用户选择的多个题库合并加载题目
    var selectedBanks = (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('selected_banks') || 'null');
        if (saved && saved.length > 0) return saved;
      } catch (e) {}
      return ['题库1--通用（并非）'];
    })();
    var questions = [];
    if (typeof BANKS !== 'undefined') {
      for (var bi = 0; bi < selectedBanks.length; bi++) {
        var bankName = selectedBanks[bi];
        if (BANKS[bankName]) {
          questions = questions.concat(BANKS[bankName]);
        }
      }
    }
    if (questions.length === 0 && typeof BANKS !== 'undefined' && BANKS['题库1--通用（并非）']) {
      questions = BANKS['题库1--通用（并非）'];
    }
  </script>
  <script>
    (function () {
      // ========== DOM 引用 ==========
      const timerEl        = document.getElementById('timer');
      const questionTextEl = document.getElementById('questionText');
      const optionsGridEl  = document.getElementById('optionsGrid');
      const wrongOverlayEl = document.getElementById('wrongOverlay');
      const correctToastEl = document.getElementById('correctToast');
      const quizWrapperEl  = document.getElementById('quizWrapper');
      const minigameToast  = document.getElementById('minigameToast');
      const exitOverlayEl  = document.getElementById('exitOverlay');

      // ========== 游戏状态 ==========
      let state, timerInterval, isAnswering = false, isGameOver = false;
      let gameQuestions = [];
      let timerPaused = false;
      let currentShuffledOptions = null; // 当前题目的选项映射
      let minigameHistory = []; // 本轮已玩过的小游戏列表，用于轮换
      let minigameIndex = 0;   // 小游戏触发次数

      // ========== 可用小游戏列表 ==========
      var MINIGAMES = [
        { id: 'minigame1', name: '霓虹跑酷', path: 'minigame1/index.html' },
        { id: 'minigame2', name: '霓虹飞驰', path: 'minigame2/index.html' },
        { id: 'minigame3', name: '东方弹幕', path: 'minigame3/index.html' }
      ];

      // 种子版选择下一个小游戏（前 N 个不重复，N = 小游戏数量）
      function pickNextMinigame() {
        var n = MINIGAMES.length;
        // 前 n 次：确保每个小游戏都出现一次
        if (minigameIndex < n) {
          var available = [];
          for (var i = 0; i < MINIGAMES.length; i++) {
            if (minigameHistory.indexOf(MINIGAMES[i].id) === -1) {
              available.push(MINIGAMES[i]);
            }
          }
          if (available.length > 0) {
            var pick = available[Math.floor(rng() * available.length)];
            minigameHistory.push(pick.id);
            minigameIndex++;
            return pick;
          }
        }
        // 之后完全随机
        minigameHistory = [];
        var pick = MINIGAMES[Math.floor(rng() * MINIGAMES.length)];
        minigameHistory.push(pick.id);
        minigameIndex = 1;
        return pick;
      }

      // ========== 设置 ==========
      var settings = { music: true, sfx: true, minigame: true, scare: false };
      try {
        var savedSettings = JSON.parse(localStorage.getItem('game_settings') || '{}');
        settings.music    = (savedSettings.music !== false);
        settings.sfx      = (savedSettings.sfx !== false);
        settings.minigame = (savedSettings.minigame !== false);
        settings.scare    = (savedSettings.scare === true);
      } catch (e) {}

      // ========== 答错图片池 ==========
      // 首次答错固定用 kawaii.png，后续从池中不重复随机
      var kawaiiPool = [
        'images/kawaii/2.png',  
        'images/kawaii/3.png',
        'images/kawaii/4.png',  
        'images/kawaii/5.jpg',  
        'images/kawaii/6.jpg',
        'images/kawaii/7.jpg',  
        'images/kawaii/8.png',  
        'images/kawaii/9.png',
        'images/kawaii/10.jpg',    
        'images/kawaii/12.png',
        'images/kawaii/13.jpg',  
        'images/kawaii/14.jpg',  
        'images/kawaii/15.png',
        'images/kawaii/16.png',  
        'images/kawaii/17.png',  
        'images/kawaii/18.png',
        'images/kawaii/19.png', 
        'images/kawaii/21.png',
        'images/kawaii/22.png', 
        'images/kawaii/23.png', 
        'images/kawaii/25.png',  
        'images/kawaii/26.png',  
        'images/kawaii/27.png',
        'images/kawaii/28.png',  
        'images/kawaii/32.png',  
        'images/kawaii/33.png'
      ];
      var wrongAnswerCount = 0;

      // ========== 答错图片系统（种子决定顺序 + 分批预加载） ==========
      var imagePreloadCache = {};
      var kawaiiQueue = [];

      function preloadImage(url) {
        if (!url || imagePreloadCache.hasOwnProperty(url)) return;
        var img = new Image();
        img.onload = function () { imagePreloadCache[url] = img; };
        img.onerror = function () { imagePreloadCache[url] = null; };
        img.src = url;
      }

      function initKawaiiSystem() {
        // 使用独立种子（gameSeed + 偏移量）决定图片弹出顺序，不影响题目顺序
        var kawaiiRng = makeRNG(gameSeed + 12345);
        var pool = kawaiiPool.slice();
        for (var i = pool.length - 1; i > 0; i--) {
          var j = Math.floor(kawaiiRng() * (i + 1));
          var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
        }
        kawaiiQueue = pool;

        // 第一波预加载：kawaii.png（必定首次出现）+ 队列前 9 张
        preloadImage('images/kawaii.png');
        for (var k = 0; k < 9 && k < kawaiiQueue.length; k++) {
          preloadImage(kawaiiQueue[k]);
        }
      }

      function getFailImage() {
        wrongAnswerCount++;
        // 第一次答错：固定 kawaii.png，之后不再出现
        if (wrongAnswerCount === 1) {
          return 'images/kawaii.png';
        }
        // 每 9 次使用后触发下一批预加载（十张用过九张）
        var queueUsed = wrongAnswerCount - 1;
        if (queueUsed > 0 && queueUsed % 9 === 0 && queueUsed < kawaiiQueue.length) {
          var batchEnd = Math.min(queueUsed + 10, kawaiiQueue.length);
          for (var bi = queueUsed; bi < batchEnd; bi++) {
            preloadImage(kawaiiQueue[bi]);
          }
        }
        var idx = (wrongAnswerCount - 2) % kawaiiQueue.length;
        return kawaiiQueue[idx];
      }

      // 成就图片预加载（用 setTimeout 分批，避免卡顿阻塞答题）
      function preloadAchievementImages() {
        var icons = [];
        if (typeof ACHIEVEMENTS !== 'undefined') {
          ACHIEVEMENTS.DEFS.forEach(function (d) { icons.push(d.icon); });
          icons.push(ACHIEVEMENTS.LOCK_ICON);
        }
        icons.forEach(function (url, index) {
          setTimeout(function () { preloadImage(url); }, index * 80);
        });
      }

      // ========== 音频系统 ==========
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      var audioCtx = null;

      function ensureAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }

      // --- 背景音乐：欢快节奏 ---
      var musicNodes = [];
      var musicPlaying = false;
      var musicUrgent = false;

      function startMusic() {
        if (!settings.music || musicPlaying) return;
        try { ensureAudio(); } catch (e) { return; }
        musicPlaying = true;
        musicUrgent = false;

        var now = audioCtx.currentTime;
        // 欢快的 I-V-vi-IV 进行在 C 大调，较快的和弦切换
        var chords = [
          [261.63, 329.63, 392.00, 523.25],  // C
          [196.00, 293.66, 392.00, 493.88],  // G
          [220.00, 261.63, 329.63, 440.00],  // Am
          [174.61, 261.63, 349.23, 440.00],  // F
        ];
        var chordDuration = 2.5; // 更快的和弦切换

        function scheduleChord(startIdx, startTime) {
          for (var rep = 0; rep < 80; rep++) {
            var chord = chords[(startIdx + rep) % chords.length];
            chord.forEach(function (freq) {
              var osc = audioCtx.createOscillator();
              var gain = audioCtx.createGain();
              var filter = audioCtx.createBiquadFilter();

              // 用明亮的波形
              osc.type = freq > 350 ? 'sine' : 'triangle';
              osc.frequency.value = freq;

              filter.type = 'lowpass';
              filter.frequency.value = 1200;
              filter.Q.value = 0.4;

              gain.gain.setValueAtTime(0, startTime + rep * chordDuration);
              gain.gain.linearRampToValueAtTime(0.03, startTime + rep * chordDuration + 0.6);
              gain.gain.setValueAtTime(0.03, startTime + rep * chordDuration + chordDuration - 0.6);
              gain.gain.linearRampToValueAtTime(0, startTime + rep * chordDuration + chordDuration);

              osc.connect(filter);
              filter.connect(gain);
              gain.connect(audioCtx.destination);

              osc.start(startTime + rep * chordDuration);
              osc.stop(startTime + rep * chordDuration + chordDuration);
              musicNodes.push(osc);
            });
            // 添加轻微的节奏感：低音鼓点
            var beatOsc = audioCtx.createOscillator();
            var beatGain = audioCtx.createGain();
            beatOsc.type = 'sine';
            beatOsc.frequency.value = 60;
            beatGain.gain.setValueAtTime(0, startTime + rep * chordDuration);
            beatGain.gain.linearRampToValueAtTime(0.04, startTime + rep * chordDuration + 0.05);
            beatGain.gain.exponentialRampToValueAtTime(0.001, startTime + rep * chordDuration + 0.15);
            beatOsc.connect(beatGain);
            beatGain.connect(audioCtx.destination);
            beatOsc.start(startTime + rep * chordDuration);
            beatOsc.stop(startTime + rep * chordDuration + 0.2);
            musicNodes.push(beatOsc);
          }
        }

        scheduleChord(0, now);
        scheduleChord(2, now + 0.06);
      }

      function switchMusicToUrgent() {
        if (!settings.music || !musicPlaying || musicUrgent) return;
        musicUrgent = true;
        try { ensureAudio(); } catch (e) { return; }

        // 停止当前音乐
        stopMusicNodes();
        musicPlaying = true;

        var now = audioCtx.currentTime;
        // 紧迫感：更快、更高的音
        var chords = [
          [329.63, 415.30, 523.25, 659.25],  // Em 高位
          [293.66, 369.99, 440.00, 587.33],  // Dm
        ];
        var chordDuration = 0.8; // 极快的切换

        function scheduleUrgent() {
          for (var rep = 0; rep < 120; rep++) {
            var chord = chords[rep % 2];
            chord.forEach(function (freq) {
              var osc = audioCtx.createOscillator();
              var gain = audioCtx.createGain();
              osc.type = 'square';
              osc.frequency.value = freq;

              gain.gain.setValueAtTime(0, now + rep * chordDuration);
              gain.gain.linearRampToValueAtTime(0.015, now + rep * chordDuration + 0.08);
              gain.gain.setValueAtTime(0.015, now + rep * chordDuration + chordDuration - 0.15);
              gain.gain.linearRampToValueAtTime(0, now + rep * chordDuration + chordDuration);

              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start(now + rep * chordDuration);
              osc.stop(now + rep * chordDuration + chordDuration);
              musicNodes.push(osc);
            });
            // 急促的鼓点
            var beatOsc = audioCtx.createOscillator();
            var beatGain = audioCtx.createGain();
            beatOsc.type = 'square';
            beatOsc.frequency.value = 50;
            beatGain.gain.setValueAtTime(0, now + rep * chordDuration);
            beatGain.gain.linearRampToValueAtTime(0.03, now + rep * chordDuration + 0.03);
            beatGain.gain.exponentialRampToValueAtTime(0.001, now + rep * chordDuration + 0.1);
            beatOsc.connect(beatGain);
            beatGain.connect(audioCtx.destination);
            beatOsc.start(now + rep * chordDuration);
            beatOsc.stop(now + rep * chordDuration + 0.12);
            musicNodes.push(beatOsc);
          }
        }

        scheduleUrgent();
      }

      function stopMusicNodes() {
        musicNodes.forEach(function (n) {
          try { n.stop(); } catch (e) {}
        });
        musicNodes = [];
      }

      function stopMusic() {
        musicPlaying = false;
        musicUrgent = false;
        stopMusicNodes();
      }

      // --- 音效 ---
      function playCorrectSfx() {
        if (!settings.sfx) return;
        try { ensureAudio(); } catch (e) { return; }
        var now = audioCtx.currentTime;
        // 明亮的上升音
        [523.25, 659.25, 783.99].forEach(function (freq, i) {
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.12, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.3);
        });
      }

      function playWrongSfx() {
        if (!settings.sfx) return;
        try { ensureAudio(); } catch (e) { return; }
        var now = audioCtx.currentTime;
        // 低沉的下行音
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(120, now + 0.35);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.5);
      }

      // ========== 种子随机数生成器 (mulberry32) ==========
      function makeRNG(seed) {
        var s = seed | 0;
        var count = 0;
        function step() {
          s = (s + 0x6D2B79F5) | 0;
          var t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          count++;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        }
        step.getCount = function () { return count; };
        return step;
      }

      // 全局种子 + RNG
      var gameSeed, rng;
      function initSeed() {
        gameSeed = Math.floor(Math.random() * 2147483647) + 1;
        rng = makeRNG(gameSeed);
        document.getElementById('seedDisplay').textContent = 'SEED: ' + gameSeed;
      }

      // 从保存的状态恢复 RNG（快进到保存的调用次数）
      function restoreRNG(seed, callCount) {
        gameSeed = seed;
        rng = makeRNG(gameSeed);
        for (var i = 0; i < callCount; i++) rng();
        document.getElementById('seedDisplay').textContent = 'SEED: ' + gameSeed;
      }

      // 种子版洗牌
      function seededShuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(rng() * (i + 1));
          var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
      }

      // 种子版随机选项顺序（用于打乱 ABCD 标签位置）
      function seededShuffleOptions(origOptions) {
        var letters = ['A', 'B', 'C', 'D'];
        var order = [0, 1, 2, 3];
        for (var i = order.length - 1; i > 0; i--) {
          var j = Math.floor(rng() * (i + 1));
          var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
        }
        var shuffled = {};
        for (var k = 0; k < 4; k++) {
          var origLetter = letters[k];
          var newLetter = letters[order[k]];
          shuffled[newLetter] = { text: origOptions[origLetter], origKey: origLetter };
        }
        return shuffled;
      }

      // ---------- 初始化 ----------
      function init() {
        try {
          // 确认题库已加载
          if (typeof questions === 'undefined' || !questions || questions.length === 0) {
            document.body.innerHTML = '<div style="text-align:center;padding:80px 20px;font-size:20px;">'
              + '题库加载失败，请检查 banks.js 文件。<br><br>'
              + '<a href="index.html" style="color:#000;">返回首页</a></div>';
            return;
          }

          // 建立 ID 索引
          var questionsById = {};
          questions.forEach(function(q) { questionsById[q.id] = q; });

          // 检测是否从小游戏返回
          var returning = localStorage.getItem('quiz_returning') === 'true';

          if (returning) {
            // 从小游戏返回：恢复状态 + 同步时间
            localStorage.removeItem('quiz_returning');
            var saved = localStorage.getItem('quiz_state');
            if (!saved) { goToGameOver(); return; }
            state = JSON.parse(saved);
            if (!state) { goToGameOver(); return; }

            // 恢复种子和 RNG（快进到之前的状态）
            var savedSeed = localStorage.getItem('quiz_seed');
            var savedCallCount = parseInt(localStorage.getItem('quiz_rng_count') || '0', 10);
            if (savedSeed) {
              restoreRNG(parseInt(savedSeed, 10), savedCallCount);
            } else {
              initSeed();
            }

            // 恢复小游戏历史
            try {
              var savedHistory = localStorage.getItem('quiz_minigame_history');
              if (savedHistory) { minigameHistory = JSON.parse(savedHistory); }
              var savedIndex = localStorage.getItem('quiz_minigame_index');
              if (savedIndex) { minigameIndex = parseInt(savedIndex, 10); }
            } catch (e) {}

            // 读取小游戏奖励时间
            var bonusTime = parseInt(localStorage.getItem('quiz_bonus_time') || '0', 10);
            if (bonusTime > 0) {
              state.timeLeft += bonusTime;
              localStorage.removeItem('quiz_bonus_time');
            }

            // 恢复题目顺序
            if (state.questionOrder && state.questionOrder.length > 0) {
              gameQuestions = state.questionOrder.map(function(id) { return questionsById[id]; }).filter(Boolean);
            }
            if (gameQuestions.length === 0) {
              gameQuestions = questions.slice();
            }

            if (state.currentQuestionIndex >= gameQuestions.length) {
              goToGameOver();
              return;
            }
          } else {
            // 新游戏：初始化种子
            initSeed();
            // 保存种子到 localStorage
            localStorage.setItem('quiz_seed', String(gameSeed));
            localStorage.setItem('quiz_rng_count', String(rng.getCount()));

            // 从首页传入的状态
            var saved = localStorage.getItem('quiz_state');
            if (!saved) {
              window.location.href = 'index.html';
              return;
            }
            state = JSON.parse(saved);
            if (!state) {
              window.location.href = 'index.html';
              return;
            }

            // 种子打乱题目顺序
            gameQuestions = seededShuffle(questions);
            state.questionOrder = gameQuestions.map(function(q) { return q.id; });
            // 重置小游戏历史
            minigameHistory = [];
            minigameIndex = 0;
            // 保存更新后的 state（含 questionOrder）
            localStorage.setItem('quiz_state', JSON.stringify(state));
            localStorage.setItem('quiz_minigame_history', JSON.stringify(minigameHistory));
            localStorage.setItem('quiz_minigame_index', String(minigameIndex));
          }

          // 初始化答错图片系统（种子决定顺序 + 分批预加载）
          initKawaiiSystem();
          // 成就图片预加载（低优先级，不阻塞答题）
          preloadAchievementImages();

          // 确保 initialTime 存在（兼容旧存档）
          if (!state.initialTime) state.initialTime = state.timeLeft || 60;

          startTimer();
          renderQuestion();

          // 首次用户交互后启动音乐
          document.addEventListener('click', function unlockAudio() {
            startMusic();
          }, { once: true });
          document.addEventListener('keydown', function unlockAudioKey() {
            startMusic();
          }, { once: true });
        } catch (e) {
          document.body.innerHTML = '<div style="text-align:center;padding:80px 20px;font-size:20px;">'
            + '游戏初始化出错：' + e.message + '<br><br>'
            + '<a href="index.html" style="color:#000;">返回首页</a></div>';
        }
      }

      // ---------- 计时器 ----------
      function startTimer() {
        clearInterval(timerInterval);
        timerPaused = false;
        updateTimerDisplay();

        timerInterval = setInterval(function () {
          if (isGameOver || timerPaused) return;

          state.timeLeft--;
          updateTimerDisplay();

          if (state.timeLeft <= 0) {
            state.timeLeft = 0;
            endGame();
          }
        }, 1000);
      }

      function pauseTimer() {
        timerPaused = true;
      }

      function resumeTimer() {
        timerPaused = false;
      }

      function updateTimerDisplay() {
        const m = Math.floor(state.timeLeft / 60);
        const s = state.timeLeft % 60;
        timerEl.textContent = '剩余时间 ' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');

        // 进度条：从右边开始减少
        var totalTime = state.initialTime || 60;
        var pct = Math.max(0, (state.timeLeft / totalTime) * 100);
        document.getElementById('progressFill').style.width = pct + '%';

        // 15 秒以下警告
        if (state.timeLeft <= 15) {
          timerEl.classList.add('warning');
          switchMusicToUrgent();
        } else {
          timerEl.classList.remove('warning');
        }
      }

      // ---------- 渲染题目 ----------
      function renderQuestion() {
        if (state.currentQuestionIndex >= gameQuestions.length) {
          endGame();
          return;
        }

        var q = gameQuestions[state.currentQuestionIndex];
        questionTextEl.textContent = q.question;

        // 种子打乱选项顺序
        currentShuffledOptions = seededShuffleOptions(q.options);

        // 生成选项按钮
        optionsGridEl.innerHTML = '';
        ['A', 'B', 'C', 'D'].forEach(function (letter) {
          var btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerHTML = '<span class="option-label">' + letter + '</span>' + currentShuffledOptions[letter].text;
          btn.addEventListener('click', function () {
            handleAnswer(letter, btn);
          });
          optionsGridEl.appendChild(btn);
        });

        isAnswering = true;
      }

      // ---------- 处理答题 ----------
      function handleAnswer(userAnswer, clickedBtn) {
        if (!isAnswering || isGameOver) return;
        isAnswering = false;

        const q = gameQuestions[state.currentQuestionIndex];
        // 通过 shuffledOptions 映射回原始选项键
        var mappedAnswer = currentShuffledOptions ? currentShuffledOptions[userAnswer].origKey : userAnswer;
        const isCorrect = (mappedAnswer === q.answer);

        // 禁用所有按钮
        var allBtns = optionsGridEl.querySelectorAll('.option-btn');
        allBtns.forEach(function (b) { b.classList.add('disabled'); });

        state.answeredCount++;

        // 成就检测：第一次答题
        var totalBefore = ACHIEVEMENTS.getTotalAnswered();
        if (totalBefore === 0) {
          ACHIEVEMENTS.markGamePlayed();
          if (ACHIEVEMENTS.unlock('first_answer')) {
            showAchievementPopup('first_answer');
          }
        }
        ACHIEVEMENTS.addAnsweredCount(1);

        if (isCorrect) {
          // 正确
          playCorrectSfx();
          clickedBtn.classList.add('correct-flash');
          state.correctQuestions.push(q.id);

          showCorrectToast();

          setTimeout(function () {
            afterAnswer();
          }, 400);

        } else {
          // 错误
          playWrongSfx();
          clickedBtn.classList.add('wrong-flash');

          // 标记正确答案
          allBtns.forEach(function (b) {
            var label = b.querySelector('.option-label').textContent;
            if (currentShuffledOptions && currentShuffledOptions[label].origKey === q.answer) {
              b.classList.add('correct-flash');
            }
          });

          state.wrongQuestions.push({
            questionId: q.id,
            question: q.question,
            options: q.options,
            correctAnswer: q.answer,
            userAnswer: mappedAnswer
          });

          // 显示答错遮罩 3 秒
          showWrongOverlay(function () {
            afterAnswer();
          });
        }
      }

      // ---------- 答对提示 ----------
      function showCorrectToast() {
        correctToastEl.classList.add('show');
        setTimeout(function () {
          correctToastEl.classList.remove('show');
        }, 600);
      }

      // ---------- 答错动画 ----------
      function showWrongOverlay(callback) {
        wrongOverlayEl.classList.add('active');

        // 重置动画（通过重新插入元素）
        var imgEl = wrongOverlayEl.querySelector('.wrong-image');
        var parent = imgEl.parentNode;
        var clone = imgEl.cloneNode(true);
        parent.replaceChild(clone, imgEl);
        // 重新获取元素引用并设置图片来源
        var newImgEl = wrongOverlayEl.querySelector('.wrong-image');
        var imgSrc = getFailImage();
        newImgEl.src = imgSrc;

        if (settings.scare) {
          // 惊吓模式：匀速变大动画 + 扣2秒
          newImgEl.classList.add('scare-anim');
          state.timeLeft = Math.max(0, state.timeLeft - 2);
          updateTimerDisplay();
          if (state.timeLeft <= 0) {
            endGame();
            return;
          }
        }
        // 普通模式：CSS 默认 zoomIn 动画（先慢后快）

        var hideDelay = settings.scare ? 1000 : 2000;
        setTimeout(function () {
          wrongOverlayEl.classList.remove('active');
          if (callback) callback();
        }, hideDelay);
      }

      // ---------- 答完一道题后 ----------
      function afterAnswer() {
        if (isGameOver) return;

        state.currentQuestionIndex++;

        // 保存状态
        localStorage.setItem('quiz_state', JSON.stringify(state));

        // 检查是否需要触发小游戏（每 5 题，且设置中开启）
        if (settings.minigame && state.answeredCount > 0 && state.answeredCount % 5 === 0 && !isGameOver) {
          triggerMinigame();
          return;
        }

        // 检查是否所有题目答完
        if (state.currentQuestionIndex >= gameQuestions.length) {
          endGame();
          return;
        }

        renderQuestion();
      }

      // ---------- 触发小游戏 ----------
      function triggerMinigame() {
        clearInterval(timerInterval);
        localStorage.setItem('quiz_state', JSON.stringify(state));
        localStorage.setItem('quiz_minigame_history', JSON.stringify(minigameHistory));
        localStorage.setItem('quiz_minigame_index', String(minigameIndex));
        localStorage.setItem('quiz_seed', String(gameSeed));
        localStorage.setItem('quiz_rng_count', String(rng.getCount()));

        // 标记从答题进入小游戏
        localStorage.setItem('quiz_returning', 'true');

        // 选择下一个小游戏（种子随机 + 轮换保证）
        var nextMG = pickNextMinigame();
        localStorage.setItem('quiz_minigame_history', JSON.stringify(minigameHistory));
        localStorage.setItem('quiz_minigame_index', String(minigameIndex));

        // 短暂提示后跳转
        minigameToast.classList.add('active');
        setTimeout(function () {
          window.location.href = nextMG.path;
        }, 1200);
      }

      // ---------- 结束游戏 ----------
      function endGame() {
        if (isGameOver) return;
        isGameOver = true;
        clearInterval(timerInterval);
        timerEl.classList.remove('warning');
        stopMusic();
        hideAchievementPopup();

        // 成就检测：完成一次游戏流程（到达游戏结束画面）
        var sessionsBefore = ACHIEVEMENTS.getTotalSessions();
        ACHIEVEMENTS.addSessionCount(1);
        var sessionsNow = ACHIEVEMENTS.getTotalSessions();
        if (sessionsNow >= 10 && sessionsBefore < 10) {
          ACHIEVEMENTS.unlock('tenth_answer');
        }

        // 保存结算数据
        var results = {
          correctCount: state.correctQuestions.length,
          totalAnswered: state.answeredCount,
          accuracy: state.answeredCount > 0
            ? (state.correctQuestions.length / state.answeredCount * 100).toFixed(1)
            : '0.0',
          correctList: state.correctQuestions,
          wrongList: state.wrongQuestions,
          totalQuestions: gameQuestions.length,
          timeLeft: state.timeLeft,
          sessionAchievements: ACHIEVEMENTS.getSessionUnlocked()
        };
        localStorage.setItem('quiz_results', JSON.stringify(results));
        localStorage.removeItem('quiz_state');
        localStorage.removeItem('quiz_returning');
        localStorage.removeItem('quiz_seed');
        localStorage.removeItem('quiz_rng_count');
        localStorage.removeItem('quiz_bonus_time');
        localStorage.removeItem('quiz_minigame_history');
        localStorage.removeItem('quiz_minigame_index');

        setTimeout(function () {
          window.location.href = 'gameover.html';
        }, 300);
      }

      function goToGameOver() {
        endGame();
      }

      // ---------- ESC 退出弹窗 ----------
      function showExitModal() {
        if (isGameOver) return;
        pauseTimer();
        exitOverlayEl.classList.add('active');
      }

      function hideExitModal() {
        resumeTimer();
        exitOverlayEl.classList.remove('active');
      }

      function confirmExit() {
        endGame();
      }

      // ---------- 成就弹窗系统 ----------
      var achPopupShowing = false;
      var achPopupFrozen = false;
      var achPopupTimer = null;

      function showAchievementPopup(achId) {
        var def = ACHIEVEMENTS.DEFS.find(function(d) { return d.id === achId; });
        if (!def) return;

        // 清除之前的计时器
        if (achPopupTimer) clearTimeout(achPopupTimer);

        var popup = document.getElementById('achPopup');
        document.getElementById('achPopupIcon').innerHTML = '<img src="' + def.icon + '" alt="">';
        document.getElementById('achPopupName').textContent = def.name;
        document.getElementById('achPopupDesc').textContent = def.desc;
        popup.classList.remove('frozen');
        document.getElementById('achPopup').querySelector('.ach-popup-hint').textContent = '按 ESC 保持常驻 | 3秒后自动消失';

        // 显示
        achPopupShowing = true;
        achPopupFrozen = false;
        popup.classList.add('show');

        // 3秒后自动隐藏
        achPopupTimer = setTimeout(function () {
          hideAchievementPopup();
        }, 3000);
      }

      function hideAchievementPopup() {
        var popup = document.getElementById('achPopup');
        popup.classList.remove('show', 'frozen');
        achPopupShowing = false;
        achPopupFrozen = false;
        if (achPopupTimer) clearTimeout(achPopupTimer);
      }

      function freezeAchievementPopup() {
        achPopupFrozen = true;
        if (achPopupTimer) clearTimeout(achPopupTimer);
        document.getElementById('achPopup').classList.add('frozen');
        document.getElementById('achPopup').querySelector('.ach-popup-hint').textContent = '已常驻，再按 ESC 立即缩回 | 选择"继续"可恢复计时';
      }

      function quickHideAchievementPopup() {
        // 快速缩回（再按一次 ESC 时触发）
        var popup = document.getElementById('achPopup');
        popup.classList.remove('show', 'frozen');
        achPopupShowing = false;
        achPopupFrozen = false;
        if (achPopupTimer) clearTimeout(achPopupTimer);
      }

      // 继续按钮：取消常驻，重新计时3秒
      function unfreezeAchievementPopup() {
        achPopupFrozen = false;
        document.getElementById('achPopup').classList.remove('frozen');
        document.getElementById('achPopup').querySelector('.ach-popup-hint').textContent = '按 ESC 保持常驻 | 3秒后自动消失';
        // 重新计时3秒
        achPopupTimer = setTimeout(function () {
          hideAchievementPopup();
        }, 3000);
      }

      // ESC 键监听
      document.addEventListener('keydown', function (e) {
        if (e.code === 'Escape' && !isGameOver) {
          // 如果成就弹窗已冻结，再按 ESC → 立刻缩回
          if (achPopupFrozen) {
            quickHideAchievementPopup();
            // 同时关闭退出界面
            if (exitOverlayEl.classList.contains('active')) {
              hideExitModal();
            }
            return;
          }
          // 如果成就弹窗正在显示但未冻结 → 冻结 + 打开退出界面
          if (achPopupShowing && !achPopupFrozen) {
            freezeAchievementPopup();
            pauseTimer();
            exitOverlayEl.classList.add('active');
            return;
          }
          // 退出弹窗开关
          if (exitOverlayEl.classList.contains('active')) {
            hideExitModal();
          } else {
            showExitModal();
          }
        }
      });

      // 退出弹窗按钮绑定
      document.getElementById('btnExitConfirm').addEventListener('click', confirmExit);
      document.getElementById('btnExitCancel').addEventListener('click', function () {
        if (achPopupFrozen) {
          unfreezeAchievementPopup();
        }
        hideExitModal();
      });

      // ---------- 启动 ----------
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>

</body>
</html>
